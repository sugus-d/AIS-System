[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

[[redirects]]
force = true
from = "/ais/*"
status = 200
to = "/ais/index.html"
